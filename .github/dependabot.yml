version: 2
updates:
  # Frontend — npm (all non-major updates grouped into one weekly PR)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      all-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend — pip (all non-major updates grouped into one weekly PR)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      all-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # SQLAlchemy 2.1 resolves postgresql:// URLs to psycopg (v3), which the
      # backend does not install, so it fails to import. Lift this rule when the
      # driver and the DATABASE_URL scheme move together (see requirements.txt).
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]

  # GitHub Actions — keep workflow action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
