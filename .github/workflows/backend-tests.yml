name: Backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

# Un empujón nuevo cancela la corrida anterior del mismo PR, pero nunca una de
# `main`: en la rama por defecto cada commit tiene que quedar verificado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # La suite corre sobre SQLite, pero lo que depende del driver de Postgres
    # solo se ve contra un Postgres de verdad (tests/test_postgres_driver.py,
    # que se salta sin TEST_POSTGRES_URL). Misma versión que producción.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pypdf: solo para pruebas. Las etiquetas se verifican leyendo el
          # texto del PDF generado, no el fuente que lo escribe.
          pip install pytest pytest-asyncio httpx pypdf
      - name: Run test suite (unit + tenant isolation)
        run: python -m pytest -q
